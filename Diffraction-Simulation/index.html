<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Diffraction Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="control-panel">
            <h2>Diffraction Simulator</h2>
            
            <div class="panel-section">
                <h3>1. Apparatus Setup</h3>
                
                <label>Laser Source</label>
                <select id="laserSelect" onchange="updateSetup()" style="width: 100%; padding: 8px; margin-bottom: 15px;">
                    <option value="632.8">He-Ne</option>
                    <option value="532">Nd:YAG</option>
                    <option value="488">Argon-ion</option>
                </select>

                <label>Diffraction Grating</label>
                <select id="gratingSelect" onchange="updateSetup()" style="width: 100%; padding: 8px; margin-bottom: 15px;">
                    <option value="1000_cm">N = 1000 lines / cm</option>
                    <option value="3000_cm">N = 3000 lines / cm</option>
                    <option value="15000_in">N = 15000 lines / inch</option>
                </select>

                <label>Screen Distance (Y in cm)</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="range" id="distanceSlider" min="15" max="60" value="30" oninput="syncY('slider')" style="flex: 2;">
                    <input type="number" id="distanceInput" min="15" max="60" value="30" oninput="syncY('input')" style="flex: 1; padding: 5px;">
                </div>
            </div>
        </div>

        <div class="right-column" style="display: flex; flex-direction: column;">
            
            <div id="canvas-container"></div>
            
            <div class="bottom-panels">
                <div class="panel-section data-readout" style="display: flex; justify-content: space-around; align-items: center;">
                    <div>
                        <p style="font-size: 12px; color: #666; margin:0;">Grating Element (a+b)</p>
                        <p><span id="valD" class="stat-num" style="color:#d9534f">0</span> cm</p>
                    </div>
                    <div>
                        <p style="font-size: 12px; color: #666; margin:0;">Distance to Screen (Y)</p>
                        <p><span id="valY" class="stat-num">0</span> cm</p>
                    </div>
                    <div>
                        <p style="font-size: 12px; color: #666; margin:0;">1st Order Spread (X₁)</p>
                        <p><span id="valX1" class="stat-num">0</span> cm</p>
                    </div>
                </div>

                <div class="panel-section" style="display: flex; align-items: center; gap: 15px;">
                    <div style="flex: 1;">
                        <label style="font-size: 12px;">Calculated λ (nm)</label>
                        <input type="number" id="studentLambda" placeholder="e.g. 600" style="width: 100%; padding: 8px;">
                    </div>
                    <button class="action-btn" onclick="checkAccuracy()" style="background-color: #28a745; height: 35px; margin-top: 15px;">CHECK ERROR</button>
                    <div style="flex: 1; text-align: center; margin-top: 15px;">
                        <span style="font-weight: bold;">Error: </span>
                        <span id="errorOutput" style="color: #dc3545; font-size: 18px; font-weight: bold;">---</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
