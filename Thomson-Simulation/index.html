<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.J. Thomson e/m Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard" style="flex-direction: column; max-width: 95vw;">
        
        <div style="display: flex; gap: 30px; width: 100%;">
            
            <div class="control-panel">
                <h2>Thomson e/m Sim</h2>
                
                <div class="panel-section">
                    <h3>1. Experiment Phase</h3>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button id="btnPhase1" class="action-btn" onclick="setPhase(1)">1. Electric Field Only</button>
                        <button id="btnPhase2" class="action-btn" style="background-color: #6c757d;" onclick="setPhase(2)">2. Magnetic Field Only</button>
                        <button id="btnPhase3" class="action-btn" style="background-color: #6c757d;" onclick="setPhase(3)">3. Balance Fields</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>2. Field Controls</h3>
                    
                    <label>Electric Field (E) - V/m</label>
                    <input type="range" id="sliderE" min="0" max="2000" value="0" step="50" oninput="updatePhysics()">
                    
                    <label style="margin-top: 15px;">Magnetic Field (B) - µT</label>
                    <input type="range" id="sliderB" min="0" max="500" value="0" step="10" oninput="updatePhysics()" disabled>
                </div>
                
                <div class="panel-section instructions" style="margin-top: 10px;">
                    <strong>System Constants:</strong><br>
                    Plate Length (L) = 10 cm<br>
                    Drift Distance (D) = 15 cm
                </div>
            </div>

            <div id="canvas-container" style="display: flex; align-items: center; justify-content: center;"></div>

            <div class="control-panel" style="width: 200px;">
                <h2 style="visibility: hidden;">Spacer</h2> 
                
                <div class="panel-section data-readout" style="flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; border-left: none; border-top: 5px solid #0056b3;">
                    <h3 style="margin-top: 0; text-align: center;">Live Readings</h3>
                    
                    <div style="display: flex; flex-direction: column; gap: 35px; width: 100%; margin-top: 30px;">
                        <div style="text-align: center;">
                            <p style="margin: 0 0 5px 0; font-size: 14px; color: #666; font-weight: bold;">E-Field (V/m)</p>
                            <span id="valE" class="stat-num" style="color:#d9534f; font-size: 24px;">0</span>
                        </div>
                        <div style="text-align: center;">
                            <p style="margin: 0 0 5px 0; font-size: 14px; color: #666; font-weight: bold;">B-Field (µT)</p>
                            <span id="valB" class="stat-num" style="color:#0056b3; font-size: 24px;">0</span>
                        </div>
                        <div style="text-align: center;">
                            <p style="margin: 0 0 5px 0; font-size: 14px; color: #666; font-weight: bold;">Deflection (y) cm</p>
                            <span id="valY" class="stat-num" style="font-size: 24px; color: #333;">0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-section" style="margin-top: 10px; width: 100%; box-sizing: border-box;">
            <h3 style="margin-top: 0; font-size: 14px; text-align: center;">Experimental Data Entry</h3>
            
            <div style="display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 15px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 12px; font-weight: bold; color: #495057;">Deflection y (cm):</label>
                    <input type="number" id="inpY" step="0.01" style="width: 80px; padding: 6px;">
                </div>
                
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 12px; font-weight: bold; color: #495057;">E-Field (V/m):</label>
                    <input type="number" id="inpE3" step="1" style="width: 80px; padding: 6px;">
                </div>
                
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 12px; font-weight: bold; color: #495057;">Balancing B-Field (µT):</label>
                    <input type="number" id="inpB" step="0.1" style="width: 80px; padding: 6px;">
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 30px; margin-top: 25px; margin-bottom: 10px; align-items: center;">
                <button class="action-btn" onclick="calculateEM()" style="background-color: #28a745; padding: 10px 30px; font-size: 14px; max-width: 250px;">CALCULATE e/m</button>
                <div id="mathOutput" style="font-weight: bold; font-size: 16px; color: #0056b3;">---</div>
            </div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
