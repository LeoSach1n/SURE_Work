<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomson e/m Simulation</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <style>
    body { background-color: #f8f9fa; }
    #canvas-container canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>

<div class="container-fluid mt-4">
  <div class="row">
    
    <div class="col-lg-3">
      
      <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-light fw-bold">1. Experiment Phase</div>
        <div class="card-body">
          <button class="btn btn-primary w-100 mb-2" id="btnPhase1" onclick="setPhase(1)">1. Electric Field Only</button>
          <button class="btn btn-secondary w-100 mb-2" id="btnPhase2" onclick="setPhase(2)">2. Magnetic Field Only</button>
          <button class="btn btn-secondary w-100" id="btnPhase3" onclick="setPhase(3)">3. Balance Fields</button>
        </div>
      </div>

      <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-light fw-bold">2. Apparatus Controls</div>
        <div class="card-body">
          
          <label class="form-label text-muted fw-bold mb-0">Accelerating Voltage (V)</label>
          <div class="d-flex align-items-center mb-3">
            <input type="range" class="form-range" id="sliderVoltage" min="100" max="1000" value="284" oninput="updatePhysics()">
            <span class="ms-2 badge bg-primary" id="valVoltage">284</span>
          </div>

          <label class="form-label text-muted fw-bold mb-0">Tube Rotation (°)</label>
          <div class="d-flex align-items-center mb-3">
            <input type="range" class="form-range" id="sliderRotation" min="0" max="360" value="0" oninput="updatePhysics()">
            <span class="ms-2 badge bg-dark" id="valRotation">0</span>
          </div>

          <hr> <label class="form-label text-muted fw-bold mb-0">Electric Field (E) - V/m</label>
          <div class="d-flex align-items-center mb-3">
            <input type="range" class="form-range" id="sliderE" min="-5000" max="5000" value="0" oninput="updatePhysics()">
            <span class="ms-2 badge bg-danger" id="valE">0</span>
          </div>

          <label class="form-label text-muted fw-bold mb-0">Magnetic Field (B) - μT</label>
          <div class="d-flex align-items-center">
            <input type="range" class="form-range" id="sliderB" min="-500" max="500" value="0" oninput="updatePhysics()">
            <span class="ms-2 badge bg-info text-dark" id="valB">0</span>
          </div>

        </div>
      </div>
    </div>

    <div class="col-lg-7 d-flex flex-column align-items-center">
      <button class="btn btn-dark btn-lg w-75 mb-3 fw-bold shadow-sm" id="btnViewToggle" onclick="toggleView()">
        <i class="bi bi-camera"></i> SWITCH TO FRONT OSCILLOSCOPE VIEW
      </button>
      
      <div id="canvas-container" class="shadow rounded overflow-hidden border"></div>
    </div>

    <div class="col-lg-2">
      <div class="card shadow-sm border-0 bg-light">
        <div class="card-header bg-dark text-white fw-bold text-center">Live Sensors</div>
        <div class="card-body text-center">
          
          <h6 class="text-muted mb-0">E-Field (V/m)</h6>
          <h4 class="text-danger fw-bold mb-3" id="readE">0</h4>

          <h6 class="text-muted mb-0">B-Field (μT)</h6>
          <h4 class="text-info fw-bold mb-3" id="readB">0</h4>

          <h6 class="text-muted mb-0">Deflection (y) cm</h6>
          <h3 class="text-success fw-bold" id="readY">0.00</h3>
          
        </div>
      </div>
    </div>

  </div>
</div>

<script src="sketch.js"></script>
</body>
</html>
