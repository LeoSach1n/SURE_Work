<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomson CRT Experiment</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <style>
    body { background-color: #e9ecef; padding-bottom: 50px; }
    #canvas-container canvas { display: block; margin: 0 auto; border-radius: 8px; }
    
    .app-container { background-color: #ffffff; border-radius: 12px; }
    
    /* Reverted: Clean, normal-weight headers */
    .section-header { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: #495057; 
      border-bottom: 2px solid #dee2e6; 
      padding-bottom: 5px; 
      margin-bottom: 15px; 
      text-transform: uppercase;
    }
    
    /* Reverted: Clean, normal-weight slider labels */
    .control-label { 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: #6c757d; 
    }

    .sensor-bar { background-color: #e2e3e5; border-radius: 8px; border-left: 6px solid #0d6efd; }
  </style>
</head>
<body>

<div class="container-fluid mt-4" style="max-width: 1450px;">
  <div class="app-container shadow-lg p-4 border border-light">
    
    <h4 class="text-primary fw-bold mb-4">Thomson CRT Experiment</h4>

    <div class="row">
      
      <div class="col-lg-3 pe-lg-4">
        
        <div class="mb-4">
          <div class="section-header">1. Experiment Phase</div>
          <button class="btn btn-primary btn-sm w-100 mb-2 fw-bold" id="btnPhase1" onclick="setPhase(1)">1. Electric Field Only</button>
          <button class="btn btn-secondary btn-sm w-100 mb-2 fw-bold" id="btnPhase2" onclick="setPhase(2)">2. Magnetic Field Only</button>
          <button class="btn btn-secondary btn-sm w-100 fw-bold" id="btnPhase3" onclick="setPhase(3)">3. Balance Fields</button>
        </div>

        <div class="mb-4">
          <div class="section-header">2. Apparatus Controls</div>
          
          <label class="control-label mb-1">Initial Electron Velocity</label>
          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-dash-circle fs-5 text-muted"></i>
            <input type="range" class="form-range mx-2" id="sliderVelocity" min="1.0" max="3.0" step="0.1" value="2.0" oninput="updatePhysics()">
            <i class="bi bi-plus-circle fs-5 text-muted"></i>
          </div>

          <hr class="my-3 text-muted">

          <label class="control-label mb-1">Electric Field (E) - V/m</label>
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-dash-circle fs-5 text-danger"></i>
            <input type="range" class="form-range mx-2" id="sliderE" min="0" max="5000" step="10" value="0" oninput="updatePhysics()">
            <i class="bi bi-plus-circle fs-5 text-danger"></i>
          </div>

          <label class="control-label mb-1">Magnetic Field (B) - µT</label>
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-dash-circle fs-5 text-info"></i>
            <input type="range" class="form-range mx-2" id="sliderB" min="0" max="500" step="1" value="0" oninput="updatePhysics()">
            <i class="bi bi-plus-circle fs-5 text-info"></i>
          </div>
        </div>

        <div class="mb-4">
          <div class="section-header">3. Calculate e/m</div>
          
          <div class="row g-2 mb-2">
            <div class="col-4">
              <input type="number" id="inpY" class="form-control form-control-sm border-secondary" placeholder="y (cm)">
            </div>
            <div class="col-4">
              <input type="number" id="inpE3" class="form-control form-control-sm border-secondary" placeholder="E (V/m)">
            </div>
            <div class="col-4">
              <input type="number" id="inpB" class="form-control form-control-sm border-secondary" placeholder="B (μT)">
            </div>
          </div>
          
          <button class="btn btn-success btn-sm w-100 fw-bold mb-2 shadow-sm" onclick="calculateEM()">CALCULATE</button>
          
          <div class="text-center fw-bold p-2 bg-light border rounded text-dark" id="mathOutput" style="font-size: 0.85rem;">---</div>
        </div>

      </div>

      <div class="col-lg-9 d-flex flex-column">
        
        <button class="btn btn-dark w-100 mb-3 fw-bold shadow-sm" id="btnViewToggle" onclick="toggleView()">
          <i class="bi bi-camera"></i> SWITCH TO FRONT VIEW
        </button>
        
        <div id="canvas-container" class="shadow-sm border"></div>

        <div class="sensor-bar mt-3 p-3 d-flex justify-content-around align-items-center shadow-sm">
          <div>
            <span class="control-label text-dark fw-bold me-2">Velocity:</span>
            <span class="bg-white border rounded px-2 py-1 text-secondary fw-bold fs-6" id="readV">2.0e7 m/s</span>
          </div>
          <div>
            <span class="control-label text-dark fw-bold me-2">E-Field:</span>
            <span class="bg-white border rounded px-2 py-1 text-danger fw-bold fs-6" id="readE">0 V/m</span>
          </div>
          <div>
            <span class="control-label text-dark fw-bold me-2">B-Field:</span>
            <span class="bg-white border rounded px-2 py-1 text-info fw-bold fs-6" id="readB">0 µT</span>
          </div>
          <div>
            <span class="control-label text-dark fw-bold me-2">Deflection (y):</span>
            <span class="bg-white border rounded px-2 py-1 text-success fw-bold fs-6" id="readY">0.00 cm</span>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="sketch.js"></script>
</body>
</html>
