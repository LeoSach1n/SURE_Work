<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.J. Thomson e/m Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="control-panel">
            <h2>Thomson e/m Sim</h2>
            
            <div class="panel-section">
                <h3>1. Experiment Phase</h3>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button id="btnPhase1" class="action-btn" onclick="setPhase(1)">1. Electric Field Only</button>
                    <button id="btnPhase2" class="action-btn" style="background-color: #6c757d;" onclick="setPhase(2)">2. Magnetic Field Only</button>
                    <button id="btnPhase3" class="action-btn" style="background-color: #6c757d;" onclick="setPhase(3)">3. Balance Fields</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>2. Field Controls</h3>
                
                <label>Electric Field (E) - V/m</label>
                <input type="range" id="sliderE" min="0" max="2000" value="0" step="50" oninput="updatePhysics()">
                
                <label style="margin-top: 15px;">Magnetic Field (B) - µT</label>
                <input type="range" id="sliderB" min="0" max="500" value="0" step="10" oninput="updatePhysics()" disabled>
            </div>
            
            <div class="panel-section instructions" style="margin-top: 10px;">
                <strong>System Constants:</strong><br>
                Plate Length (L) = 10 cm<br>
                Drift Distance (D) = 15 cm
            </div>
        </div>

        <div class="right-column" style="display: flex; flex-direction: column; width: 100%;">
            
            <div id="canvas-container"></div>
            
            <div class="bottom-panels">
                <div class="panel-section data-readout" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <h3 style="margin-top: 0;">Live Readings</h3>
                    <div style="display: flex; justify-content: space-between;"><span>E-Field:</span> <span id="valE" class="stat-num" style="color:#d9534f">0</span></div>
                    <div style="display: flex; justify-content: space-between;"><span>B-Field:</span> <span id="valB" class="stat-num" style="color:#0056b3">0</span></div>
                    <div style="display: flex; justify-content: space-between;"><span>Deflection (y):</span> <span id="valY" class="stat-num">0.00</span></div>
                </div>

                <div class="panel-section" style="flex: 2;">
                    <h3 style="margin-top: 0;">Experimental Data Entry</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label style="font-size: 11px;">Phase 1 Deflection y (cm)</label>
                            <input type="number" id="inpY" style="width: 100%; padding: 4px;">
                        </div>
                        <div>
                            <label style="font-size: 11px;">Phase 1 E-Field (V/m)</label>
                            <input type="number" id="inpE1" style="width: 100%; padding: 4px;">
                        </div>
                        <div>
                            <label style="font-size: 11px;">Phase 3 Bal. E-Field (V/m)</label>
                            <input type="number" id="inpE3" style="width: 100%; padding: 4px;">
                        </div>
                        <div>
                            <label style="font-size: 11px;">Phase 3 Bal. B-Field (µT)</label>
                            <input type="number" id="inpB" style="width: 100%; padding: 4px;">
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
                        <button class="action-btn" onclick="calculateEM()" style="background-color: #28a745; white-space: nowrap;">CALCULATE e/m</button>
                        <div id="mathOutput" style="font-weight: bold; font-size: 16px; color: #0056b3;">---</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
