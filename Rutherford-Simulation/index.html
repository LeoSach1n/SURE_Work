<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutherford Scattering Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="control-panel">
            <h2>Rutherford Simulator</h2>
            
            <div class="panel-section">
                <h3>1. Apparatus Setup</h3>
                
                <label>Target Nucleus</label>
                <div class="periodic-table">
                    <button class="element-tile" onclick="setElement(79, this)">
                        <span class="atomic-num">79</span>
                        <span class="symbol">Au</span>
                    </button>
                    <button class="element-tile" onclick="setElement(47, this)">
                        <span class="atomic-num">47</span>
                        <span class="symbol">Ag</span>
                    </button>
                    <button class="element-tile" onclick="setElement(29, this)">
                        <span class="atomic-num">29</span>
                        <span class="symbol">Cu</span>
                    </button>
                    <button class="element-tile active" onclick="setElement(13, this)">
                        <span class="atomic-num">13</span>
                        <span class="symbol">Al</span>
                    </button>
                </div>

                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #0056b3; font-weight: bold; margin-top:10px;">
                    <input type="checkbox" id="singleNucleusToggle" style="width: 18px; height: 18px;"> 
                    Single Nucleus Mode
                </label>

                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #0056b3; font-weight: bold; margin-top:10px;">
                    <input type="checkbox" id="fieldToggle" checked style="width: 18px; height: 18px;"> 
                    Show Electric Field
                </label>
            </div>

            <div class="panel-section">
                <h3>2. Beam Controls</h3>
                <label>Alpha Particle Energy</label>
                <input type="range" id="energySlider" min="25" max="60" value="25">
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button id="fireBtn" class="action-btn" onclick="fireNewParticle()">SINGLE</button>
                    <button id="burstBtn" class="action-btn burst" onclick="fireBurst()">BURST</button>
                </div>
                
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px; padding: 10px 15px; background-color: #ffeeba; border: 1px solid #ffdf7e; border-radius: 6px;">
                    <span style="font-size: 14px; font-weight: bold; color: #dc3545;">Continuous Beam Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="continuousBeamToggle" onchange="toggleContinuousBeam()">
                        <span class="slider round"></span>
                    </label>
                </div>

                <button class="action-btn clear" onclick="clearExperiment()">CLEAR DATA & SCREEN</button>
            </div>

        </div>

        <div class="right-column">
            <div id="canvas-container"></div>
            
            <div class="panel-section data-readout">
                <p>Total Fired: <span id="statFired" class="stat-num">0</span></p>
                <p>Screen Hits: <span id="statHits" class="stat-num">0</span></p>
                <p>Escaped (Gap): <span id="statEscaped" class="stat-num">0</span></p>
            </div>
        </div>
    </div>
    
    <script src="sketch.js"></script>
</body>
</html>
