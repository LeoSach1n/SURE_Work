<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Sphere Scattering Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="control-panel">
            <h2>Kinematic Scattering</h2>
            
            <div class="panel-section">
                <h3>1. Apparatus Setup</h3>
                
                <label>Detector Radius</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="radiusSlider" min="150" max="280" value="220" style="flex-grow: 1; cursor: pointer;">
                </div>
            </div>

            <div class="panel-section">
                <h3>2. Projectile Controls</h3>
                <label>Firing Velocity</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="velocitySlider" min="2" max="20" value="10" style="flex-grow: 1; cursor: pointer;">
                </div>
                
                <button id="fireBtn" class="action-btn" onclick="fireNewProjectile()" style="margin-top: 15px; padding: 12px; font-size: 15px;">
                    🎯 FIRE PROJECTILE
                </button>
                
                <button class="action-btn clear" onclick="clearExperiment()">CLEAR DATA & SCREEN</button>
            </div>
        </div>

        <div class="right-column">
            <div id="canvas-container"></div>
            
            <div class="panel-section data-readout">
                <p>Total Fired: <span id="statFired" class="stat-num">0</span></p>
                <p>Screen Hits: <span id="statHits" class="stat-num">0</span></p>
                <p>Escaped (Gap): <span id="statEscaped" class="stat-num">0</span></p>
            </div>
        </div>
    </div>
    
    <script src="sketch.js"></script>
</body>
</html>
